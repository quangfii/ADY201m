<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giá Tốt</title>
  <meta name="description" content="Tìm kiếm và so sánh giá sản phẩm giữa WinMart và Bách Hóa Xanh.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2313763d'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='22' font-family='Arial' font-weight='700' fill='white'%3E%E2%82%AB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Giá Tốt"><span class="brand-mark">₫</span><span>Giá Tốt</span></a>
    <div class="status"><span class="status-dot"></span><span id="updatedText">Đang tải dữ liệu</span></div>
  </header>

  <main>
    <section class="search-band">
      <div class="search-inner">
        <p class="eyebrow">SO SÁNH WINMART & BÁCH HÓA XANH</p>
        <h1>Tìm món cần mua,<br>chọn nơi có giá tốt hơn.</h1>
        <div class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Ví dụ: ba rọi heo, sữa tươi, nước mắm...">
          <button id="clearButton" type="button" aria-label="Xóa tìm kiếm" title="Xóa">×</button>
        </div>
        <div class="quick-search" aria-label="Gợi ý tìm kiếm">
          <button data-query="thịt heo">Thịt heo</button><button data-query="trứng gà">Trứng gà</button><button data-query="sữa">Sữa</button><button data-query="cá">Cá</button>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="toolbar">
        <div><h2 id="resultTitle">Sản phẩm mới cập nhật</h2><p id="resultCount"></p></div>
        <div class="filters">
          <select id="storeFilter" aria-label="Lọc siêu thị"><option value="all">Cả hai siêu thị</option><option value="winmart">WinMart</option><option value="bachhoaxanh">Bách Hóa Xanh</option></select>
          <select id="sortFilter" aria-label="Sắp xếp"><option value="relevance">Phù hợp nhất</option><option value="price-asc">Giá thấp trước</option><option value="unit-asc">Đơn giá thấp trước</option></select>
        </div>
      </div>
      <div id="recommendation" class="recommendation" hidden></div>
      <div id="productGrid" class="product-grid" aria-live="polite"></div>
      <div id="emptyState" class="empty" hidden><h3>Chưa tìm thấy sản phẩm</h3><p>Thử tên ngắn hơn hoặc bỏ tên thương hiệu.</p></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
